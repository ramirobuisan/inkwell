[package]
name = "inkwell"
version = "0.1.0"
edition = "2021"
description = "Manga page translation workbench: drop comics, add text, translate, export"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# Fast pictures even in quick (debug) builds: libraries are always optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
